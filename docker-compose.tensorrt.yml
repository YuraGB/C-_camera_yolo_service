services:
  camera-cv-tensorrt:
    container_name: camera_cv_service_tensorrt

    build:
      context: .
      dockerfile: Dockerfile.tensorrt
      args:
        CUDA_VERSION: "12.2.2-runtime-ubuntu22.04"
        TENSORRT_VERSION: "8.6.1"
        LIBDATACHANNEL_VERSION: "v0.22.5"
        UBUNTU_VERSION: "22.04"

    image: camera-cv-service-tensorrt:latest

    network_mode: host

    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/nvidia0:/dev/nvidia0"
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"

    group_add:
      - video

    restart: unless-stopped

    environment:
      - LD_LIBRARY_PATH=/opt/onnxruntime/lib:/opt/openh264/lib:/usr/local/lib:/usr/local/cuda/lib64
      - CAMERA_MODEL_PATH=/models/yolov8x.engine
      - CAMERA_ONNX_FALLBACK_MODEL_PATH=/models/yolov8x.onnx
      - CAMERA_TEST_VIDEO_PATH=/media/test_video.mp4
      - CAMERA_SIGNALING_URL=${CAMERA_SIGNALING_URL:-ws://127.0.0.1:3002/ws}
      - CAMERA_AUTH_JWT_SECRET=${CAMERA_AUTH_JWT_SECRET:-}
      - CAMERA_MIN_DETECTION_INTERVAL_MS=${CAMERA_MIN_DETECTION_INTERVAL_MS:-0}
      - CAMERA_VERBOSE_LOGS=${CAMERA_VERBOSE_LOGS:-false}
      - RUNTIME_BACKEND=tensorrt

    volumes:
      - ./models:/models
      - ./media:/media
      - /dev/v4l:/dev/v4l:ro

    shm_size: "1gb"

    tty: true
    stdin_open: true

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: 1
